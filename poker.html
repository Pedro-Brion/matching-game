<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0"
    />
    <title>H2Poker Game</title>
    <style>
      :root {
        --background: oklab(24.906% 0.00572 -0.02192); /* #26263a */
        --foreground: oklab(91.571% 0.00375 -0.01306); /* #26263a */
        --primary: oklab(42.54% 0.1417 -0.1246); /* #77158e */
        --primary-dark: oklab(28.36% 0.0456 -0.1019); /* #2f185a */
        --primary-dark-2: oklab(37.69% 0.1239 -0.1082); /* #641277 */
        --accent: oklab(76.38% -0.1413 0.0238); /* #27cfa5 */
        --spm-orange: oklab(76.98% 0.0542 0.1299); /* #efa144 */
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
        background: var(--background);
        overflow: hidden;
        touch-action: none;
        width: 100vw;
        height: 100vh;
      }

      .game {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .header {
        display: flex;
        justify-content: center;
        padding: 1rem;

        .logo {
          height: 3rem;
        }
      }

      .gameContainer {
        border-radius: 1rem;
        margin: 1rem;
        flex: 1;
        position: relative;
      }

      .table {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        background-color: var(--primary);
        box-shadow: inset 0 2px 4px var(--background);
        outline: 8px solid var(--primary-dark-2);
        pointer-events: none;

        .table-logo {
          width: 45%;
          opacity: 0.15;
        }
      }

      .controls {
        padding: 1rem;
      }

      .card {
        position: absolute;
        aspect-ratio: 800 / 1167;
        perspective: 100px;
        transition: all 0.4s cubic-bezier(0, 0.55, 0.45, 1);
        transition-property: translate, rotate;
        translate: var(--x, 0) var(--y, 0);
        rotate: 0 var(--angle,0) 0;

        .card-inner {
          position: relative;
          width: 100%;
          height: 100%;
          transition: transform 0.4s cubic-bezier(0, 0.55, 0.45, 1);
          transform-style: preserve-3d;
          pointer-events: none;
        }

        .card-front,
        .card-back {
          display: block;
          height: 100%;
          width: 100%;
          position: absolute;
          backface-visibility: hidden;
          inset: 0;
          border-radius: 3px;
        }

        .card-front {
          transform: rotateY(180deg);
        }

        &:hover {
          animation: wobble 400ms linear infinite alternate;
        }
      }

      button {
        font-size: 20px;
        padding: 0.75rem 1rem;
        width: 100%;
        color: var(--background);
        font-weight: bolder;
        background-color: var(--accent);
        border: none;
        border-radius: 0.5rem;
        animation: glow 1s ease-in-out infinite alternate;
      }

      @keyframes glow {
        0% {
          box-shadow: 0 0 0 0 var(--accent);
          transform: scale(1);
        }
        100% {
          box-shadow: 0 0 20px 5px var(--accent);
          transform: scale(1.05);
        }
      }

      @keyframes wobble {
        0% {
          box-shadow: 0 0 0 0 var(--accent);
          transform: scale(1) translateY(-5px) rotate(-1deg);
        }
        100% {
          box-shadow: 0 0 20px 5px var(--accent);
          transform: scale(1.025) translateY(-5px) rotate(1deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="game">
      <div class="header">
        <img class="logo" src="/img/logo-2024.svg" alt="h2" />
      </div>
      <div class="gameContainer">
        <div class="table">
          <img class="table-logo" src="/img/logo-2024.svg" alt="" />
        </div>
      </div>
      <div class="controls">
        <button id="start">Start</button>
      </div>
    </div>

    <script type="module">
      const PADDING = 10;
      const CARD_WIDTH = 80;
      const CARD_HEIGHT = CARD_WIDTH * (800 / 1167);
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      class Card {
        id = "";
        element = null;
        rotation = 0;
        innerCard = null;

        static #elementMap = new Map();
        static #cardCount = 0;
        constructor(initialPosition = { x: 0, y: 0, rotation: 0 }) {
          const cardIndex = ++Card.#cardCount;

          const card = document.createElement("div");
          card.dataset.index = cardIndex;
          card.classList.add("card");
          card.style.setProperty("--x", `${initialPosition.x}px`);
          card.style.setProperty("--y", `${initialPosition.y}px`);
          card.style.setProperty("--angle", `${initialPosition.rotation}deg`);
          card.style.setProperty("width", `${CARD_WIDTH}px`);

          const innerCard = document.createElement("div");
          innerCard.classList.add("card-inner");
          card.appendChild(innerCard);

          const front = document.createElement("img");
          front.classList.add("card-front");
          front.src = "/img/AS.svg";
          innerCard.appendChild(front);

          const back = document.createElement("img");
          back.classList.add("card-back");
          back.src = "/img/back.svg";
          innerCard.appendChild(back);

          this.id = cardIndex;
          this.element = card;
          this.innerCard = innerCard;

          Card.#elementMap.set(this.element, this);
        }

        static findByEl(el) {
          return Card.#elementMap.get(el);
        }

        flip() {
          this.rotation += 180;
          this.innerCard.style.transform = `rotateY(${this.rotation}deg)`;
          return this.innerCard.getAnimations().map((anim) => anim.finished);
        }

        moveTo(x, y) {
          this.element.style.setProperty("--x", `${x}px`);
          this.element.style.setProperty("--y", `${y}px`);
          return this.element.getAnimations().map((anim) => anim.finished);
        }

        destroy() {
          // this.element.remove();
        }
      }

      class Player {
        cardSlots = [];

        constructor(slots) {
          this.cardSlots.push(...slots);
        }
        addCard(card) {}
      }

      const GAME_STATE = Object.freeze({
        DEALING: "dealing",
        PLAYER_MOVE: "playerMove",
      });

      const Game = {
        state: GAME_STATE.DEALING,
        container: document.querySelector(".gameContainer"),
        width: 0,
        height: 0,
        cards: [],
        addCard(newCard) {
          Game.container.appendChild(newCard.element);
          Game.cards.push(newCard);
        },
        init() {
          Game.container.addEventListener("click", (ev) => {
            const target = ev.target;
            if (!ev.target.classList.contains("card")) return;
            const card = Card.findByEl(target);
            if (!card) return;
            // card.flip();
          });
          Game.width = Game.container.clientWidth;
          Game.height = Game.container.clientHeight;
        },
        async dealCards() {
          for (let i = 0; i < Game.cards.length; i++) {
            Game.cards[i].destroy();
          }
          for (let i = 0; i < 5; i++) {
            const newCard = new Card({
              x: Game.width / 2 - CARD_WIDTH / 2,
              y: Game.height / 4 - CARD_HEIGHT / 2,
            });
            Game.addCard(newCard);
          }
          const animations = [];

          const CARD_COUNT = Game.cards.length;
          const availableWidth = Game.width - 2 * PADDING;
          const gap =
            (availableWidth - CARD_WIDTH * CARD_COUNT) / (CARD_COUNT - 1);

          const targetY = Game.height / 2 - CARD_HEIGHT / 2;
          const startX = PADDING;

          for (let i = 0; i < Game.cards.length; i++) {
            await sleep(200);
            animations.push(
              ...Game.cards[i].moveTo(startX + (gap + CARD_WIDTH) * i, targetY),
            );
          }
          await sleep(200);
          for (let i = 0; i < Game.cards.length; i++) {
            await sleep(200);
            animations.push(...Game.cards[i].flip());
          }
          await Promise.allSettled(animations);
          Game.state = GAME_STATE.PLAYER_MOVE;
          console.log(Game.state);
        },
        start() {},
      };

      Game.init();

      document
        .querySelector("#start")
        .addEventListener("click", Game.dealCards);
    </script>
  </body>
</html>
